<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo Shop</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/index.js"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/">Demo Shop</a>
      <a class="cart-link" href="/cart">Cart <span id="cart-count">0</span></a>
    </header>
    <main>
      <h1>Clothes, shoes and hats</h1>
      <form id="search" role="search">
        <input name="query" type="search" placeholder="Search, e.g. red shirt" aria-label="Search" />
        <input name="maxPrice" type="number" min="0" step="0.01" placeholder="Max price" aria-label="Max price in EUR" />
        <button type="submit">Search</button>
      </form>
      <p id="result-count" class="muted"></p>
      <div id="products" class="grid"></div>
    </main>
  </body>
</html>
