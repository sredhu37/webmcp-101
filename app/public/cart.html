<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cart | Demo Shop</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/cart.js"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/">Demo Shop</a>
      <a class="cart-link" href="/cart">Cart <span id="cart-count">0</span></a>
    </header>
    <main class="narrow">
      <h1>Your cart</h1>
      <div id="cart"></div>
      <section id="checkout-section" hidden>
        <h2>Checkout</h2>
        <form id="checkout">
          <label for="name">Full name</label>
          <input id="name" name="name" autocomplete="name" required />
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
          <label for="address">Shipping address</label>
          <input id="address" name="address" autocomplete="street-address" required />
          <button type="submit">Place order</button>
          <p class="status" role="status"></p>
        </form>
      </section>
    </main>
  </body>
</html>
